# Publishing a new Spine: bump `version` in spine-app/Cargo.toml and push to
# main. If no release exists for that version yet, GitHub builds Spine.exe,
# fingerprints it and publishes release v<version>; every Spine with updates
# turned on offers it the next time it starts. Pushes that don't change the
# version just run the tests.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version and whether it's already released
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path spine-app/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "new=false" >> $env:GITHUB_OUTPUT } else { "new=true" >> $env:GITHUB_OUTPUT }
          exit 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        working-directory: spine-core
        run: cargo test

      - name: Build Spine.exe and the installer
        if: steps.ver.outputs.new == 'true'
        working-directory: spine-app
        env:
          SPINE_REPO: ${{ github.repository }}
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles nsis

      - name: Package
        if: steps.ver.outputs.new == 'true'
        shell: pwsh
        run: |
          Copy-Item spine-app/target/release/Spine.exe Spine.exe
          $setup = Get-ChildItem spine-app/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName Spine-Setup.exe
          foreach ($f in 'Spine.exe', 'Spine-Setup.exe') {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$f.sha256" -Value "$h  $f" -NoNewline
          }

      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.new == 'true'
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Spine ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            Spine-Setup.exe
            Spine-Setup.exe.sha256
            Spine.exe
            Spine.exe.sha256
          generate_release_notes: true
          body: |
            **New to Spine?** Download **Spine-Setup.exe** and run it. No admin rights needed.
            Already have Spine? It updates itself: Settings → Updates.
