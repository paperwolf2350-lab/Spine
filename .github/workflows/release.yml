# Publishing a new Spine: write what changed in release-notes.md (Spine shows the
# part above the --- line in Settings), bump `version` in spine-app/Cargo.toml,
# and push to main. If no release exists for that version yet, GitHub builds the
# Windows and Linux versions and publishes release v<version> with all of them.
# Every Spine with updates turned on offers it the next time it starts.
# Pushes that don't change the version just run the tests.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      new: ${{ steps.ver.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - name: Version and whether it's already released
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -m1 '^version = ' spine-app/Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "${{ github.repository }}" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (Linux)
        working-directory: spine-core
        run: cargo test

  windows:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (Windows)
        working-directory: spine-core
        run: cargo test
      - name: Build Spine.exe and the installer
        working-directory: spine-app
        env:
          SPINE_REPO: ${{ github.repository }}
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles nsis
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item spine-app/target/release/Spine.exe dist/Spine.exe
          $setup = Get-ChildItem spine-app/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName dist/Spine-Setup.exe
          foreach ($f in 'Spine.exe', 'Spine-Setup.exe') {
            $h = (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "dist/$f.sha256" -Value "$h  $f" -NoNewline
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    needs: check
    if: needs.check.outputs.new == 'true'
    # The oldest supported Ubuntu, so the AppImage runs on as many distributions as possible.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - name: Build the AppImage and .deb
        working-directory: spine-app
        env:
          SPINE_REPO: ${{ github.repository }}
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles appimage,deb
      - name: Package
        run: |
          mkdir dist
          cp spine-app/target/release/bundle/appimage/*.AppImage dist/Spine-x86_64.AppImage
          cp spine-app/target/release/bundle/deb/*.deb dist/Spine-amd64.deb
          chmod +x dist/Spine-x86_64.AppImage
          cd dist && for f in Spine-x86_64.AppImage Spine-amd64.deb; do printf '%s  %s' "$(sha256sum "$f" | cut -d' ' -f1)" "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    needs: [check, windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: Spine ${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: dist/*
