[package]
name = "spine-core"
version = "0.4.2"
edition = "2024"

[dependencies]
percent-encoding = "2.3.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.26"

[[bin]]
name = "spine-scan"
path = "src/main.rs"

# Linux: a built-in downloader for systems without the curl command.
[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "2.12", features = ["native-certs"] }
